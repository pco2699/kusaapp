name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway through an rsync.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Optional: create a "production" environment in the repo settings to require a
    # manual approval before this job runs.
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'apps/kusaapp' }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME || 'habit-tracker' }}
      # The server is reached over Tailscale SSH: the tunnel is already mutually
      # authenticated by WireGuard and the login is authorized by the tailnet's SSH ACL,
      # so there is no key to install here. The host key is minted by tailscaled on the
      # far side and there is nothing stable for CI to pin, hence the relaxed checking.
      SSH_OPTS: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy target is configured
        run: |
          : "${DEPLOY_HOST:?set the DEPLOY_HOST repository variable to the VPS's MagicDNS name}"
          : "${DEPLOY_USER:?set the DEPLOY_USER repository variable to the login user on the VPS}"

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest
          hostname: gha-kusa-deploy
          # Fail here, with a clear message, rather than inside rsync.
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Sync the checkout
        # config.json and habits.db live only on the server: they hold the token and all
        # the history, and --delete would otherwise wipe them on the first deploy.
        run: |
          rsync -az --delete \
            -e "ssh $SSH_OPTS" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'config.json' \
            --exclude 'habits.db' \
            --exclude '*.log' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Restart and health-check
        run: |
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' SERVICE_NAME='$SERVICE_NAME' bash -s" <<'REMOTE'
          set -euo pipefail
          # `systemctl --user` over SSH needs to be pointed at the user's own bus.
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          cd "$DEPLOY_PATH"

          systemctl --user restart "$SERVICE_NAME"

          # The port and token are whatever the box's own config.json says.
          PORT=$(node -p "require('./config.json').port")
          TOKEN=$(node -p "require('./config.json').token")
          for i in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:$PORT/api/health" | grep -q '"ok":true'; then
              echo "healthy on port $PORT"
              exit 0
            fi
            sleep 1
          done

          echo "service did not come back healthy; last 40 log lines:" >&2
          journalctl --user -u "$SERVICE_NAME" -n 40 --no-pager >&2 || true
          exit 1
          REMOTE
