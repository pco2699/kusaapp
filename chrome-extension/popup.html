<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="titlebar">
      <h1>Habit Tracker</h1>
      <button id="settingsToggle" class="ghost" title="設定">⚙ 設定</button>
    </div>
    <div class="summary" id="summaryText"></div>
    <div class="conn" id="connText"></div>
  </header>

  <div id="setupBox" class="setup hidden">
    <label for="urlInput">サーバーURL</label>
    <input id="urlInput" type="text" placeholder="http://127.0.0.1:8090" autocomplete="off">
    <label for="keyInput">キー（token）</label>
    <input id="keyInput" type="password" placeholder="config.json の token" autocomplete="off">
    <button id="saveBtn" class="primary">保存して接続</button>
  </div>

  <div id="emptyState" class="empty hidden">習慣がありません</div>
  <ul id="habitList"></ul>

  <section class="add">
    <input id="nameInput" type="text" placeholder="新しい習慣…" autocomplete="off">
    <div class="schedule">
      <div class="presets">
        <button type="button" data-preset="daily">毎日</button>
        <button type="button" data-preset="weekdays">平日</button>
        <button type="button" data-preset="weekend">週末</button>
      </div>
      <div class="days" id="dayPicker">
        <label><input type="checkbox" value="0">日</label>
        <label><input type="checkbox" value="1">月</label>
        <label><input type="checkbox" value="2">火</label>
        <label><input type="checkbox" value="3">水</label>
        <label><input type="checkbox" value="4">木</label>
        <label><input type="checkbox" value="5">金</label>
        <label><input type="checkbox" value="6">土</label>
      </div>
    </div>
    <label class="flexible">
      <input type="checkbox" id="flexibleInput"> どれでも（any-of-weekday・ゲージ非換算）
    </label>
    <button id="addBtn" class="primary">追加</button>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
